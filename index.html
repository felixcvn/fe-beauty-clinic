<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PBICS — Sistem Informasi Klinik Kecantikan untuk manajemen pasien, stok, dan transaksi." />
    <title>PBICS</title>

    <!-- Preconnect ke Fontshare untuk mempercepat DNS lookup -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Load font secara non-blocking: mulai sebagai print, swap ke all setelah selesai -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback untuk browser tanpa JavaScript -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
